<div
  class="modal-dialog-backdrop"
  role="presentation"
  (click)="onBackdropClick($event)"
>
  <div
    #dialogPanel
    class="modal-dialog"
    [class.modal-dialog--md]="size() === 'md'"
    [class.modal-dialog--lg]="size() === 'lg'"
    [class.modal-dialog--xl]="size() === 'xl'"
    [class.modal-dialog--spacious]="spacious()"
    role="dialog"
    aria-modal="true"
    [attr.aria-labelledby]="titleId"
    (click)="$event.stopPropagation()"
  >
    <header class="modal-dialog__header">
      <div class="modal-dialog__header-copy">
        @if (eyebrow()) {
          <p class="modal-dialog__eyebrow">{{ eyebrow() }}</p>
        }
        <h2 [id]="titleId" class="modal-dialog__title">{{ title() }}</h2>
      </div>
      <button
        type="button"
        class="modal-dialog__close"
        [attr.aria-label]="closeAriaLabel()"
        (click)="close()"
      >
        ×
      </button>
    </header>

    <div class="modal-dialog__body">
      <!-- Module-specific fields / content -->
      <ng-content />
    </div>

    <!--
      Footer stays pinned to the panel bottom. `.record-detail__actions` is
      selected by class so every information dialog keeps that class and still
      gets the full-width divider; `[modalFooter]` remains for other modules.
    -->
    <footer class="modal-dialog__footer">
      <ng-content select="[modalFooter], .record-detail__actions" />
    </footer>
  </div>
</div>
