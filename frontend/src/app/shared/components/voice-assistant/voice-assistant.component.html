<div
  class="voice-assistant"
  [attr.data-status]="voice.status()"
  [class.is-active]="voice.active()"
  [style.--speech-level]="voice.speechLevel()"
>
  @if (voice.active()) {
    <div class="voice-assistant__backdrop" aria-hidden="true"></div>
  }

  <div
    class="voice-assistant__call"
    [class.is-positioned]="position() !== null"
    [style.left.px]="position()?.x"
    [style.top.px]="position()?.y"
    (pointerdown)="onDragPointerDown($event)"
  >
    <div class="voice-assistant__person" aria-hidden="true">
      <svg
        class="voice-assistant__human"
        viewBox="18 8 144 212"
        xmlns="http://www.w3.org/2000/svg"
        focusable="false"
      >
        <defs>
          <linearGradient id="cv-skin" x1="0.28" y1="0" x2="0.78" y2="1">
            <stop offset="0%" stop-color="#f4ccae" />
            <stop offset="100%" stop-color="#deaa82" />
          </linearGradient>
          <linearGradient id="cv-hair" x1="0.2" y1="0" x2="0.9" y2="1">
            <stop offset="0%" stop-color="#2c211c" />
            <stop offset="100%" stop-color="#120e0c" />
          </linearGradient>
          <linearGradient id="cv-blazer" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#4d6d54" />
            <stop offset="100%" stop-color="#2f4a36" />
          </linearGradient>
          <radialGradient id="cv-cheek" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#e89b8c" stop-opacity="0.42" />
            <stop offset="100%" stop-color="#e89b8c" stop-opacity="0" />
          </radialGradient>
        </defs>

        <g class="voice-assistant__torso">
          <path
            d="M18 220 C22 164 52 150 74 150 L82 176 L90 156 L98 176 L106 150 C128 150 158 164 162 220 Z"
            fill="url(#cv-blazer)"
          />
          <path d="M74 150 L90 188 L106 150 L98 150 L90 172 L82 150 Z" fill="#f4efe6" />
          <path d="M74 150 L70 220" stroke="#2a4030" stroke-width="1.2" fill="none" opacity="0.35" />
          <path d="M106 150 L110 220" stroke="#2a4030" stroke-width="1.2" fill="none" opacity="0.35" />
        </g>

        <path d="M78 132 C78 156 102 156 102 132" fill="#d9a47c" />
        <path d="M82 132 C82 150 98 150 98 132" fill="url(#cv-skin)" />

        <g class="voice-assistant__head">
          <path
            fill="url(#cv-hair)"
            d="M50 86 C42 46 62 16 90 14 C122 12 144 42 136 86 C150 102 148 128 128 138 C138 92 130 40 90 38 C56 42 44 78 50 86 Z"
          />

          <ellipse cx="48" cy="96" rx="8" ry="12" fill="#e0aa82" />
          <ellipse cx="132" cy="96" rx="8" ry="12" fill="#e0aa82" />
          <ellipse cx="48" cy="97" rx="4.4" ry="7" fill="#d49874" />
          <ellipse cx="132" cy="97" rx="4.4" ry="7" fill="#d49874" />

          <path
            fill="url(#cv-skin)"
            d="M90 40 C118 40 132 62 132 90 C132 118 114 140 90 142 C66 140 48 118 48 90 C48 62 62 40 90 40 Z"
          />

          <path
            fill="url(#cv-hair)"
            d="M50 72 C46 96 50 122 64 136 C56 112 52 88 58 68 C54 58 50 60 50 72 Z"
          />
          <path
            fill="url(#cv-hair)"
            d="M130 72 C134 96 130 122 116 136 C124 112 128 88 122 68 C126 58 130 60 130 72 Z"
          />
          <path
            fill="url(#cv-hair)"
            d="M56 52 C68 34 80 48 90 38 C104 50 116 32 128 54 C120 64 108 56 90 60 C74 56 62 64 56 52 Z"
          />

          <path
            class="voice-assistant__brow voice-assistant__brow--left"
            d="M64 76 Q76 70 86 76"
            fill="none"
            stroke="#1c1410"
            stroke-width="2.4"
            stroke-linecap="round"
          />
          <path
            class="voice-assistant__brow voice-assistant__brow--right"
            d="M94 76 Q104 70 116 76"
            fill="none"
            stroke="#1c1410"
            stroke-width="2.4"
            stroke-linecap="round"
          />

          <g class="voice-assistant__eye voice-assistant__eye--left">
            <ellipse cx="74" cy="88" rx="11.5" ry="8.6" fill="#fff" />
            <ellipse class="voice-assistant__iris" cx="75" cy="89" rx="5.2" ry="5.4" fill="#4a3728" />
            <circle cx="75.5" cy="89" r="2.5" fill="#16120f" />
            <circle cx="77.4" cy="87" r="1.2" fill="#fff" />
            <ellipse class="voice-assistant__lid" cx="74" cy="79.5" rx="12.4" ry="10" fill="#e8b894" />
          </g>
          <g class="voice-assistant__eye voice-assistant__eye--right">
            <ellipse cx="106" cy="88" rx="11.5" ry="8.6" fill="#fff" />
            <ellipse class="voice-assistant__iris" cx="105" cy="89" rx="5.2" ry="5.4" fill="#4a3728" />
            <circle cx="104.5" cy="89" r="2.5" fill="#16120f" />
            <circle cx="107.2" cy="87" r="1.2" fill="#fff" />
            <ellipse class="voice-assistant__lid" cx="106" cy="79.5" rx="12.4" ry="10" fill="#e8b894" />
          </g>

          <path
            d="M90 96 L86 110 Q90 114 94 110"
            fill="none"
            stroke="#c99270"
            stroke-width="1.6"
            stroke-linecap="round"
          />

          <ellipse cx="64" cy="108" rx="10" ry="6" fill="url(#cv-cheek)" />
          <ellipse cx="116" cy="108" rx="10" ry="6" fill="url(#cv-cheek)" />

          <g class="voice-assistant__mouth">
            <g class="voice-assistant__smile">
              <path
                d="M80.5 125.2 C85.6 122.8 88 122.6 90 123.2 C92 122.6 94.4 122.8 99.5 125.2 C96.2 127.6 93.2 128.2 90 128.2 C86.8 128.2 83.8 127.6 80.5 125.2 Z"
                fill="#c56b6a"
              />
              <path
                d="M83.4 126.8 C86.6 128 93.4 128 96.6 126.8"
                fill="none"
                stroke="#a24f54"
                stroke-width="0.85"
                stroke-linecap="round"
                opacity="0.5"
              />
            </g>
            <g class="voice-assistant__talk">
              <path
                class="voice-assistant__lips"
                d="M78.6 123.2 C84.2 120.8 86.8 120.4 90 120.4 C93.2 120.4 95.8 120.8 101.4 123.2 C102.8 124.8 102.8 127.4 101.2 129 C96.6 131.8 93.2 132.4 90 132.4 C86.8 132.4 83.4 131.8 78.8 129 C77.2 127.4 77.2 124.8 78.6 123.2 Z"
                fill="#a44c52"
              />
              <path
                d="M80 122.4 C85 120.8 87.4 120.6 90 120.6 C92.6 120.6 95 120.8 100 122.4 C97 123.8 93.2 124.2 90 124.2 C86.8 124.2 83 123.8 80 122.4 Z"
                fill="#8f3f46"
              />
              <ellipse cx="90" cy="126.4" rx="8.6" ry="3.2" fill="#3a151c" />
              <path
                d="M83.2 122.8 C86.8 121.8 93.2 121.8 96.8 122.8 L96.2 124.4 C93.2 123.6 86.8 123.6 83.8 124.4 Z"
                fill="#f4efe8"
              />
              <ellipse cx="90" cy="128.8" rx="5.4" ry="1.35" fill="#c46a72" />
              <path
                d="M79.8 128.6 C84.8 131.6 95.2 131.6 100.2 128.6 C96.4 131 83.6 131 79.8 128.6 Z"
                fill="#c45d64"
              />
            </g>
          </g>
        </g>
      </svg>
    </div>

    <p class="voice-assistant__name">{{ statusLabel() }}</p>

    @if (voice.error(); as message) {
      <p class="voice-assistant__error" role="alert">{{ message }}</p>
    }

    <div class="voice-assistant__actions">
      <button
        type="button"
        class="voice-assistant__mic"
        [attr.aria-pressed]="voice.active()"
        [attr.aria-label]="buttonLabel()"
        [title]="buttonLabel()"
        (click)="voice.toggle()"
      >
        <span class="voice-assistant__pulse" aria-hidden="true"></span>
        @if (voice.active()) {
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
            <rect x="7" y="7" width="10" height="10" rx="2" />
          </svg>
        } @else {
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <rect x="9" y="3" width="6" height="11" rx="3" />
            <path d="M5 11a7 7 0 0 0 14 0" />
            <line x1="12" y1="18" x2="12" y2="21" />
          </svg>
        }
      </button>

      @if (voice.active()) {
        <button
          type="button"
          class="voice-assistant__close"
          aria-label="Close voice"
          title="Close voice"
          (click)="onClose()"
        >
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
            <path d="M6 6l12 12M18 6L6 18" stroke-linecap="round" />
          </svg>
        </button>
      }
    </div>

    @if (voice.active()) {
      <p class="voice-assistant__hint">Drag to move · Tap mic to speak · Say stop or tap X to close</p>
    }
  </div>
</div>
