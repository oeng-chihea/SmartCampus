<form class="attendance-filter" aria-label="Attendance filters" (ngSubmit)="submit()">
  <div class="attendance-filter__controls">
    <label class="attendance-filter__search">
      <span>Find record</span>
      <input
        type="search"
        name="search"
        [placeholder]="filters().searchPlaceholder"
        [ngModel]="search()"
        (ngModelChange)="search.set($event)"
      />
    </label>

    <div class="attendance-filter__session">
      <span id="attendance-session-label">Session</span>
      <button
        type="button"
        class="attendance-filter__session-trigger"
        aria-haspopup="dialog"
        [attr.aria-expanded]="pickerOpen()"
        aria-labelledby="attendance-session-label"
        (click)="openSessionPicker()"
      >
        <span class="attendance-filter__session-value">{{ sessionLabel() }}</span>
        <span class="attendance-filter__session-chevron" aria-hidden="true">
          <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M5.5 7.75L10 12.25L14.5 7.75"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </span>
      </button>
    </div>

    <label>
      <span>Status</span>
      <app-select-dropdown
        name="status"
        [options]="filters().statusOptions"
        [ngModel]="status()"
        (ngModelChange)="status.set($event)"
        [compact]="true"
      />
    </label>

    <label>
      <span>Date</span>
      <app-select-dropdown
        name="date"
        [options]="filters().dateOptions"
        [ngModel]="date()"
        (ngModelChange)="date.set($event)"
        [compact]="true"
      />
    </label>

    <button type="submit">Apply</button>
  </div>
</form>

@if (pickerOpen()) {
  <app-session-picker-dialog
    [selectedId]="sessionId()"
    [selectedTitle]="sessionLabel()"
    (closed)="closeSessionPicker()"
    (confirmed)="onSessionConfirmed($event)"
  />
}
