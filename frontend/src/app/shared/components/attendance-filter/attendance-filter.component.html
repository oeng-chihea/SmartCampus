<form class="attendance-filter" aria-label="Attendance filters" (ngSubmit)="submit()">
  <div class="attendance-filter__controls">
    <label class="attendance-filter__search">
      <span>Find record</span>
      <input
        type="search"
        name="search"
        [placeholder]="filters().searchPlaceholder"
        [ngModel]="search()"
        (ngModelChange)="search.set($event)"
      />
    </label>

    <label>
      <span>Session</span>
      <app-select-dropdown
        name="session"
        [options]="filters().sessionOptions"
        [ngModel]="sessionId()"
        (ngModelChange)="sessionId.set($event)"
        [compact]="true"
      />
    </label>

    <label>
      <span>Status</span>
      <app-select-dropdown
        name="status"
        [options]="filters().statusOptions"
        [ngModel]="status()"
        (ngModelChange)="status.set($event)"
        [compact]="true"
      />
    </label>

    <label>
      <span>Date</span>
      <app-select-dropdown
        name="date"
        [options]="filters().dateOptions"
        [ngModel]="date()"
        (ngModelChange)="date.set($event)"
        [compact]="true"
      />
    </label>

    <button type="submit">Apply</button>
  </div>
</form>
