<section class="student-form-card" aria-labelledby="student-form-heading">
  <p>Quick action</p>
  <h2 id="student-form-heading">Add student draft</h2>
  <form>
    <label>
      Full name
      <input type="text" placeholder="Student full name" />
    </label>
    <label>
      Class
      <select>
        @for (course of courseOptions(); track course) {
          <option>{{ course }}</option>
        }
      </select>
    </label>
    <button type="button">Create draft</button>
  </form>
</section>
