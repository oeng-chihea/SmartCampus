<form class="quick-lookup" aria-label="Quick student filter">
  <label for="student-search">Quick lookup</label>
  <div class="quick-lookup__controls">
    <input id="student-search" type="search" [placeholder]="quickFilter().studentIdPlaceholder" />
    <select aria-label="Request status">
      @for (status of quickFilter().statusOptions; track status) {
        <option>{{ status }}</option>
      }
    </select>
    <button type="button">Filter</button>
  </div>
</form>
