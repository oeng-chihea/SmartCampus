<section class="login-card" aria-labelledby="forgot-title">
  <header class="login-card__header">
    <p class="login-card__eyebrow">Student portal</p>
    <h1 id="forgot-title">Forgot password</h1>
    <p class="login-card__lead">
      Enter your student email and we will send you a link to choose a new password.
    </p>
  </header>

  <form class="login-card__form" (ngSubmit)="submit()" novalidate>
    <label class="login-card__field">
      Email
      <input
        type="email"
        name="email"
        [(ngModel)]="email"
        autocomplete="username"
        placeholder="you@smartcampus.edu"
        [disabled]="sent()"
      />
    </label>

    @if (alert(); as formAlert) {
      <div class="login-card__alert-wrap">
        <app-alert [alert]="formAlert" />
      </div>
    }

    <button type="submit" class="login-card__submit" [disabled]="submitting() || sent()">
      {{ submitting() ? 'Sending…' : sent() ? 'Link sent' : 'Send reset link' }}
    </button>

    <a class="login-card__link" routerLink="/auth/student">Back to sign in</a>
  </form>
</section>
