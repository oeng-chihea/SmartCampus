<section class="login-card" aria-labelledby="reset-title">
  <header class="login-card__header">
    <p class="login-card__eyebrow">Student portal</p>
    <h1 id="reset-title">Set a new password</h1>
    <p class="login-card__lead">
      @if (hasToken) {
        Choose a new password with at least 8 characters.
      } @else {
        This reset link is invalid or has expired.
      }
    </p>
  </header>

  @if (hasToken) {
    <form class="login-card__form" (ngSubmit)="submit()" novalidate>
      <label class="login-card__field">
        New password
        <input
          type="password"
          name="password"
          [(ngModel)]="password"
          autocomplete="new-password"
          placeholder="Enter new password"
        />
      </label>

      <label class="login-card__field">
        Confirm password
        <input
          type="password"
          name="confirm"
          [(ngModel)]="confirm"
          autocomplete="new-password"
          placeholder="Enter it again"
        />
      </label>

      @if (alert(); as formAlert) {
        <div class="login-card__alert-wrap">
          <app-alert [alert]="formAlert" />
        </div>
      }

      <button type="submit" class="login-card__submit" [disabled]="submitting()">
        {{ submitting() ? 'Saving…' : 'Set new password' }}
      </button>
    </form>
  } @else {
    <div class="login-card__form">
      <a class="login-card__link" routerLink="/auth/forgot-password">Request a new link</a>
    </div>
  }
</section>
