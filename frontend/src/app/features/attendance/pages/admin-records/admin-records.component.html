<section class="attendance-page" aria-labelledby="attendance-title">
  <header class="attendance-page__header">
    <div class="attendance-page__copy">
      <h1 id="attendance-title">{{ page.title }}</h1>
      <p>{{ page.subtitle }}</p>
    </div>
  </header>

  <section class="attendance-page__metrics" aria-label="Attendance status summary">
    @for (metric of page.metrics; track metric.label; let index = $index) {
      <app-stat-card [card]="metric" [animationDelay]="index * 70" />
    }
  </section>

  <section class="attendance-page__workspace" aria-label="Attendance filters and records">
    <div class="attendance-page__toolbar">
      <app-attendance-filter [filters]="page.filters" (apply)="onFilterApply($event)" />
    </div>
    <app-table
      eyebrow="Attendance records"
      title="Student scan log"
      [countLabel]="filteredRecords().length + ' records'"
      tableAriaLabel="Attendance scan records"
      [columns]="attendanceColumns"
      [rows]="filteredRecords()"
      [showExport]="true"
      emptyTitle="No records match your filters"
      emptyMessage="Try another student ID, session, or status."
    />
  </section>
</section>
